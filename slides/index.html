<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สไลด์ - AI Skills</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <main class="content-page">
        <div class="page-header">
            <h1>📊 สไลด์พรีเซนเทชัน</h1>
            <p>เน้นความรวดเร็วในการแปลงข้อความเป็นหน้าสไลด์ พร้อมการจัดวางภาพประกอบ</p>
        </div>

        <!-- ===== ปุ่มเลือกรูปแบบตาข่าย (แสดงโลโก้ + ชื่อสั้น) ===== -->
        <div class="ai-grid" id="aiGrid">
            <div class="ai-grid-item" data-target="gamma">
                <div class="ai-grid-icon">
                    <img src="../images/ai-icons/gamma.jpg" alt="Gamma">
                </div>
                <span class="ai-grid-name">Gamma</span>
            </div>

            <div class="ai-grid-item" data-target="tome">
                <div class="ai-grid-icon">
                    <img src="../images/ai-icons/tome.jpg" alt="Tome">
                </div>
                <span class="ai-grid-name">Tome</span>
            </div>

            <div class="ai-grid-item" data-target="gemini">
                <div class="ai-grid-icon">
                    <img src="../images/ai-icons/gemini.jpg" alt="Gemini">
                </div>
                <span class="ai-grid-name">Gemini</span>
            </div>
        </div>

        <!-- ===== รายละเอียดแบบขยาย (ซ่อนไว้ก่อน) ===== -->
        <div class="ai-details" id="aiDetails">
            <div class="ai-detail-item" data-target="gamma" style="display:none;">
                <a href="gamma.html" class="ai-btn">
                    <div class="ai-btn-image">
                        <img src="../images/ai-icons/gamma.jpg" alt="Gamma">
                    </div>
                    <div class="ai-btn-info">
                        <span class="ai-name">Gamma (gamma.app)</span>
                        <span class="ai-desc">สร้างสไลด์สวยงามด้วย AI ในพริบตา</span>
                    </div>
                    <span class="ai-arrow">→</span>
                </a>
            </div>

            <div class="ai-detail-item" data-target="tome" style="display:none;">
                <a href="tome.html" class="ai-btn">
                    <div class="ai-btn-image">
                        <img src="../images/ai-icons/tome.jpg" alt="Tome">
                    </div>
                    <div class="ai-btn-info">
                        <span class="ai-name">Tome</span>
                        <span class="ai-desc">นำเสนอแบบ Storytelling ด้วย AI</span>
                    </div>
                    <span class="ai-arrow">→</span>
                </a>
            </div>

            <div class="ai-detail-item" data-target="gemini" style="display:none;">
                <a href="gemini.html" class="ai-btn">
                    <div class="ai-btn-image">
                        <img src="../images/ai-icons/gemini.jpg" alt="Gemini">
                    </div>
                    <div class="ai-btn-info">
                        <span class="ai-name">Gemini (Paid tier)</span>
                        <span class="ai-desc">สร้างสไลด์จากเอกสารสูงสุด 20 ชิ้น/วัน</span>
                    </div>
                    <span class="ai-arrow">→</span>
                </a>
            </div>
        </div>

        <div class="back-link">
            <a href="../index.html">← กลับไปหน้าแรก</a>
        </div>
    </main>

    <div id="footer"></div>
    <script src="../js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gridItems = document.querySelectorAll('.ai-grid-item');
            const detailItems = document.querySelectorAll('.ai-detail-item');
            let activeTarget = null;

            gridItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    const target = this.dataset.target;

                    // ถ้าเลือกตัวเดิม → ไปที่หน้า
                    if (activeTarget === target) {
                        const link = document.querySelector(`.ai-detail-item[data-target="${target}"] a`);
                        if (link) {
                            window.location.href = link.href;
                        }
                        return;
                    }

                    // ซ่อนทั้งหมด
                    detailItems.forEach(d => d.style.display = 'none');

                    // แสดงตัวที่เลือก
                    const selected = document.querySelector(`.ai-detail-item[data-target="${target}"]`);
                    if (selected) {
                        selected.style.display = 'block';
                        activeTarget = target;
                    }

                    // Highlight ปุ่มที่เลือก
                    gridItems.forEach(g => g.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
