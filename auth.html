<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - AI Skills for University</title>
    <meta name="description" content="สมัครสมาชิกหรือเข้าสู่ระบบเพื่อใช้งาน AI Skills for University">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== Auth Page Styles ===== */
        .auth-page {
            min-height: calc(100vh - 64px - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-8);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--color-gray-200);
            padding: var(--space-10);
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .auth-header h1 {
            font-family: var(--font-heading);
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--color-gray-900);
            margin-bottom: var(--space-2);
        }

        .auth-header p {
            font-size: var(--text-sm);
            color: var(--color-gray-500);
        }

        .auth-tabs {
            display: flex;
            gap: var(--space-1);
            background: var(--color-gray-100);
            border-radius: var(--radius-md);
            padding: var(--space-1);
            margin-bottom: var(--space-8);
        }

        .auth-tab {
            flex: 1;
            padding: var(--space-2_5) var(--space-4);
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--color-gray-500);
            font-family: var(--font-sans);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .auth-tab.active {
            background: white;
            color: var(--color-gray-900);
            box-shadow: var(--shadow-xs);
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: var(--space-5);
        }

        .auth-form.active {
            display: flex;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-1_5);
        }

        .form-group label {
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--color-gray-700);
        }

        .form-group input {
            padding: var(--space-2_5) var(--space-3_5);
            border: 1px solid var(--color-gray-300);
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-size: var(--text-base);
            color: var(--color-gray-900);
            background: white;
            transition: all var(--transition-fast);
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--color-primary-500);
            box-shadow: 0 0 0 3px rgba(249, 117, 74, 0.1);
        }

        .form-group input::placeholder {
            color: var(--color-gray-400);
        }

        .form-group input.error {
            border-color: #ff6b6b;
            background: #fff5f5;
        }

        .form-error {
            font-size: var(--text-xs);
            color: #ff6b6b;
            display: none;
            margin-top: 4px;
        }

        .auth-submit {
            padding: var(--space-3) var(--space-6);
            background: var(--color-primary-500);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-size: var(--text-base);
            font-weight: var(--font-semibold);
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-top: var(--space-2);
        }

        .auth-submit:hover {
            background: var(--color-primary-600);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .auth-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-error {
            background: var(--color-error-50);
            color: var(--color-error-700);
            font-size: var(--text-sm);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-error-100);
            display: none;
        }

        .auth-success {
            background: var(--color-success-50);
            color: var(--color-success-700);
            font-size: var(--text-sm);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-success-100);
            display: none;
        }

        .auth-footer {
            text-align: center;
            font-size: var(--text-sm);
            color: var(--color-gray-500);
            margin-top: var(--space-6);
        }

        .auth-footer a {
            color: var(--color-primary-500);
            font-weight: var(--font-medium);
            cursor: pointer;
        }

        .auth-footer a:hover {
            color: var(--color-primary-700);
        }

        .password-hint {
            font-size: var(--text-xs);
            color: var(--color-gray-400);
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: var(--space-6);
            }
            .auth-header h1 {
                font-size: var(--text-xl);
            }
        }
    </style>
</head>
<body>
    <div id="navbar"></div>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <h1>ยินดีต้อนรับ</h1>
                <p>เข้าสู่ระบบหรือสมัครสมาชิกเพื่อใช้งาน</p>
            </div>

            <!-- Error/Success Messages -->
            <div class="auth-error" id="authError"></div>
            <div class="auth-success" id="authSuccess"></div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login" onclick="switchTab('login')">เข้าสู่ระบบ</button>
                <button class="auth-tab" data-tab="register" onclick="switchTab('register')">สมัครสมาชิก</button>
            </div>

            <!-- Login Form -->
            <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">อีเมล</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required>
                    <div class="form-error" id="loginEmailError"></div>
                </div>
                <div class="form-group">
                    <label for="loginPassword">รหัสผ่าน</label>
                    <input type="password" id="loginPassword" placeholder="········" required>
                    <div class="form-error" id="loginPasswordError"></div>
                </div>
                <button type="submit" class="auth-submit" id="loginBtn">เข้าสู่ระบบ</button>
                <div class="auth-footer">
                    ยังไม่มีบัญชี? <a onclick="switchTab('register')">สมัครสมาชิก</a>
                </div>
            </form>

            <!-- Register Form -->
            <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="regName">ชื่อจริง / ชื่อผู้ใช้</label>
                    <input type="text" id="regName" placeholder="เช่น สมชาย ใจดี" required>
                    <div class="form-error" id="regNameError"></div>
                </div>
                <div class="form-group">
                    <label for="regEmail">อีเมล</label>
                    <input type="email" id="regEmail" placeholder="you@example.com" required>
                    <div class="form-error" id="regEmailError"></div>
                </div>
                <div class="form-group">
                    <label for="regPassword">รหัสผ่าน</label>
                    <input type="password" id="regPassword" placeholder="อย่างน้อย 6 ตัว" minlength="6" required>
                    <div class="form-error" id="regPasswordError"></div>
                    <span class="password-hint">รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร</span>
                </div>
                <button type="submit" class="auth-submit" id="registerBtn">สมัครสมาชิก</button>
                <div class="auth-footer">
                    มีบัญชีอยู่แล้ว? <a onclick="switchTab('login')">เข้าสู่ระบบ</a>
                </div>
            </form>
        </div>
    </main>

    <div id="footer"></div>

    <!-- Scroll to Top -->
    <button class="scroll-to-top" id="scrollToTop" aria-label="กลับด้านบน">
        <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/main.js"></script>

    <script>
        // ============================================
        // AUTH PAGE LOGIC
        // ============================================

        console.log('📄 Auth page loaded');

        // ===== Switch Tab =====
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            document.getElementById(tab + 'Form').classList.add('active');
            clearMessages();
            clearFieldErrors();
        }

        // ===== Clear Messages =====
        function clearMessages() {
            const errorEl = document.getElementById('authError');
            const successEl = document.getElementById('authSuccess');
            if (errorEl) errorEl.style.display = 'none';
            if (successEl) successEl.style.display = 'none';
        }

        function clearFieldErrors() {
            document.querySelectorAll('.form-error').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.form-group input').forEach(el => el.classList.remove('error'));
        }

        function showFieldError(fieldId, msg) {
            const errorEl = document.getElementById(fieldId + 'Error');
            const inputEl = document.getElementById(fieldId);
            if (errorEl) {
                errorEl.textContent = msg;
                errorEl.style.display = 'block';
            }
            if (inputEl) {
                inputEl.classList.add('error');
            }
        }

        function showError(msg) {
            const el = document.getElementById('authError');
            el.textContent = '❌ ' + msg;
            el.style.display = 'block';
            document.getElementById('authSuccess').style.display = 'none';
        }

        function showSuccess(msg) {
            const el = document.getElementById('authSuccess');
            el.textContent = '✅ ' + msg;
            el.style.display = 'block';
            document.getElementById('authError').style.display = 'none';
        }

        function setLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> กรุณารอสักครู่...';
            } else {
                btn.disabled = false;
                btn.textContent = btn.dataset.originalText || 'เข้าสู่ระบบ';
            }
        }

        // ===== Register =====
        async function handleRegister(e) {
            e.preventDefault();
            clearMessages();
            clearFieldErrors();

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const btn = document.getElementById('registerBtn');

            btn.dataset.originalText = btn.textContent;

            // Validate
            let hasError = false;
            
            if (!name || name.length < 2) {
                showFieldError('regName', 'กรุณากรอกชื่อจริง (อย่างน้อย 2 ตัวอักษร)');
                hasError = true;
            }
            
            if (!email) {
                showFieldError('regEmail', 'กรุณากรอกอีเมล');
                hasError = true;
            } else if (!email.includes('@') || !email.includes('.')) {
                showFieldError('regEmail', 'รูปแบบอีเมลไม่ถูกต้อง (ต้องมี @ และ .)');
                hasError = true;
            }
            
            if (!password || password.length < 6) {
                showFieldError('regPassword', 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
                hasError = true;
            }

            if (hasError) return;

            // ตรวจสอบ Supabase
            if (typeof registerUser === 'undefined') {
                showError('ระบบกำลังโหลด กรุณารอสักครู่แล้วลองใหม่');
                return;
            }

            if (!supabaseClient) {
                showError('ระบบกำลังเชื่อมต่อ กรุณารอสักครู่');
                if (typeof initSupabase === 'function') {
                    initSupabase();
                }
                await new Promise(resolve => setTimeout(resolve, 1000));
                if (!supabaseClient) {
                    showError('ไม่สามารถเชื่อมต่อระบบได้ กรุณารีเฟรชหน้า');
                    return;
                }
            }

            setLoading(btn, true);

            try {
                console.log('🔐 Registering:', { name, email });
                const result = await registerUser(name, email, password);
                console.log('✅ Register result:', result);
                
                showSuccess('สมัครสมาชิกสำเร็จ!');
                document.getElementById('registerForm').reset();
                
                setTimeout(() => {
                    switchTab('login');
                    showSuccess('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ');
                }, 2000);

            } catch (err) {
                console.error('❌ Register error:', err);
                showError(err.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่');
            } finally {
                setLoading(btn, false);
            }
        }

        // ===== Login =====
        async function handleLogin(e) {
            e.preventDefault();
            clearMessages();
            clearFieldErrors();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.dataset.originalText = btn.textContent;

            let hasError = false;
            
            if (!email) {
                showFieldError('loginEmail', 'กรุณากรอกอีเมล');
                hasError = true;
            } else if (!email.includes('@') || !email.includes('.')) {
                showFieldError('loginEmail', 'รูปแบบอีเมลไม่ถูกต้อง');
                hasError = true;
            }
            
            if (!password) {
                showFieldError('loginPassword', 'กรุณากรอกรหัสผ่าน');
                hasError = true;
            }

            if (hasError) return;

            if (typeof loginUser === 'undefined') {
                showError('ระบบกำลังโหลด กรุณารอสักครู่แล้วลองใหม่');
                return;
            }

            if (!supabaseClient) {
                showError('ระบบกำลังเชื่อมต่อ กรุณารอสักครู่');
                if (typeof initSupabase === 'function') {
                    initSupabase();
                }
                await new Promise(resolve => setTimeout(resolve, 1000));
                if (!supabaseClient) {
                    showError('ไม่สามารถเชื่อมต่อระบบได้ กรุณารีเฟรชหน้า');
                    return;
                }
            }

            setLoading(btn, true);

            try {
                console.log('🔐 Logging in:', { email });
                const result = await loginUser(email, password);
                console.log('✅ Login result:', result);
                
                // บันทึก session
                localStorage.setItem('user', JSON.stringify(result));
                window.currentUser = result;
                
                showSuccess('เข้าสู่ระบบสำเร็จ!');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (err) {
                console.error('❌ Login error:', err);
                showError(err.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่');
            } finally {
                setLoading(btn, false);
            }
        }

        // ===== เริ่มต้นเมื่อโหลดหน้า =====
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 DOM ready');
            
            // ตรวจสอบว่า login อยู่หรือไม่
            setTimeout(() => {
                const savedUser = localStorage.getItem('user');
                if (savedUser) {
                    try {
                        const user = JSON.parse(savedUser);
                        if (user && user.email) {
                            console.log('👤 Already logged in:', user.email);
                            window.location.href = 'index.html';
                        }
                    } catch (e) {
                        localStorage.removeItem('user');
                    }
                }
            }, 300);
        });

        // Export functions
        window.switchTab = switchTab;
        window.handleLogin = handleLogin;
        window.handleRegister = handleRegister;
        window.showError = showError;
        window.showSuccess = showSuccess;
        window.clearMessages = clearMessages;
        
        console.log('✅ Auth page functions ready');
    </script>
</body>
</html>
